# Inventario de ejemplo — AdminLinux Clase 11
#
# El inventario le dice a Ansible QUÉ máquinas administra.
# Con una sola VM alcanza: practicás todo contra [local] (tu propia máquina).

# Tu propia máquina, sin SSH. Ideal para armar el reto.
[local]
localhost ansible_connection=local

# Servidores reales, se llega por SSH. Reemplazá las IPs por las tuyas.
# (Comentado: descomentá y editá cuando tengas una 2da VM.)
# [bastion]
# 192.168.1.10

# Variables comunes al grupo (ejemplo de buena práctica).
# Fijate que es literalmente lo mismo que ponés en ~/.ssh/config:
# usuario, puerto y qué clave usar.
# [bastion:vars]
# ansible_user=<usuario>
# ansible_port=22
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
# ansible_python_interpreter=/usr/bin/python3
