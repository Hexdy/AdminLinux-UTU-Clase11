---
# armar_reto.yml — Armá tu puesto de guardia para el análisis del bastión.
# MULTI-DISTRO: Debian/Ubuntu (apt) · Arch (pacman) · Fedora/RHEL (dnf).
#
# ESCENARIO (no es hacking, es laburo de sysadmin): entrás de guardia y el equipo
# de la noche te dejó el volcado de journalctl del servicio SSH de bastion01 y los
# dos archivos de configuración tal cual estaban. Este playbook, en un solo paso:
#   1) Comprueba que tu distro esté soportada.
#   2) Instala el cliente OpenSSH y gawk con el módulo genérico 'package'
#      (usa apt, pacman o dnf según tu distro) dentro de un block/rescue: si no
#      podés escalar a root, el playbook NO se rompe, te avisa y sigue.
#   3) Crea el área de trabajo  datos/reto/          (módulo file).
#   4) Copia la evidencia que dejó la guardia anterior  (módulo copy).
#   5) Genera una MISION.txt personalizada con TUS datos  (módulo template + facts).
#   6) Deja la nota del equipo con permisos 0600 = solo su dueño (security by design).
#
# 🔒 Lo que este playbook NO hace, a propósito: no genera claves, no toca tu ~/.ssh,
# no instala ni arranca sshd, no abre puertos. Solo deja archivos para que los leas.
#
# La gracia de Ansible: el MISMO playbook arma el laboratorio en Ubuntu, Arch o
# Fedora sin que cambies una línea (aunque el paquete se llame distinto en cada
# una). Y es IDEMPOTENTE: corrélo mil veces, siempre deja el entorno igual
# (2ª corrida = changed=0).
#
# Con una sola VM alcanza: corre todo contra localhost (grupo [local]).
#
# ¿No tenés Ansible? Corré primero:   bash comprobar_requisitos.sh
#
# Simular sin aplicar (RECOMENDADO la 1ª vez):
#   ansible-playbook armar_reto.yml -l local --check --diff
# Aplicar de verdad:
#   ansible-playbook armar_reto.yml -l local
#   (si al instalar los paquetes te pide contraseña de sudo, agregá  -K)

- name: Armar el puesto de guardia del bastión (Debian/Ubuntu + Arch + Fedora)
  hosts: local
  become: false

  vars:
    # true = instala cliente SSH + gawk (necesita sudo; agregá -K si te pide clave).
    # Poné false si ya los tenés y no querés usar sudo.
    instalar_paquetes: true
    area: "{{ playbook_dir }}/../datos/reto"

    # El cliente OpenSSH se llama DISTINTO en cada familia. Este mapa es la forma
    # prolija de resolverlo: una sola tarea, tres nombres posibles.
    paquete_cliente_ssh:
      Debian: openssh-client
      Archlinux: openssh
      RedHat: openssh-clients

  pre_tasks:
    # Si tu distro no es de estas 3 familias, el playbook se detiene ACÁ y te lo
    # explica (en vez de romper a la mitad).
    - name: Comprobar que la distribución está soportada
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'Archlinux', 'RedHat']
        fail_msg: >-
          Distro no soportada: {{ ansible_distribution }}
          (familia {{ ansible_os_family }}). Este material corre en Debian/Ubuntu
          (gestor apt), Arch (gestor pacman) y Fedora/RHEL (gestor dnf).
        success_msg: >-
          Distro soportada: {{ ansible_distribution }} ({{ ansible_os_family }}) ·
          cliente SSH = {{ paquete_cliente_ssh[ansible_os_family] }}.
        quiet: true

    # block/rescue = "intentá esto; si falla, hacé esto otro". Instalar necesita
    # sudo y en un aula eso no siempre está: si falla, seguimos igual porque la
    # evidencia se lee con herramientas que ya tenés.
    - name: Instalar las herramientas de análisis (tolerante a fallos)
      when: instalar_paquetes | bool
      block:
        - name: Instalar cliente OpenSSH + gawk (package elige apt, pacman o dnf)
          ansible.builtin.package:
            name:
              - "{{ paquete_cliente_ssh[ansible_os_family] }}"
              - gawk
            state: present
          become: true
      rescue:
        - name: Avisar que seguimos sin instalar nada
          ansible.builtin.debug:
            msg: >-
              No pude instalar los paquetes (¿sin sudo?). Sigo igual: la evidencia
              se analiza con grep/awk/sort, que ya vienen en tu sistema. Si querés
              instalarlos a mano:
              {{ 'sudo apt install openssh-client gawk' if ansible_os_family == 'Debian'
                 else ('sudo pacman -S --needed openssh gawk' if ansible_os_family == 'Archlinux'
                 else 'sudo dnf install openssh-clients gawk') }}

  tasks:
    - name: Crear el área de trabajo de la guardia
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ area }}"
        - "{{ area }}/sshd_config.d"

    - name: Copiar la evidencia que dejó la guardia anterior
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/{{ item.src }}"
        dest: "{{ area }}/{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: 'auth_reto.log', dest: 'auth_reto.log' }
        - { src: 'sshd_config_reto', dest: 'sshd_config' }
        - { src: '99-lab_reto.conf', dest: 'sshd_config.d/99-lab.conf' }

    - name: Generar TU misión personalizada (módulo template + facts)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/mision.txt.j2"
        dest: "{{ area }}/MISION.txt"
        mode: '0644'

    - name: Dejar la nota del equipo y asegurarla (0600 = solo su dueño)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/nota_equipo.txt"
        dest: "{{ area }}/nota_equipo.txt"
        mode: '0600'

  post_tasks:
    # "Verificar antes de confiar": mostramos cuánta evidencia quedó lista.
    - name: Contar las líneas de evidencia
      ansible.builtin.command:
        cmd: "wc -l {{ area }}/auth_reto.log {{ area }}/sshd_config"
      changed_when: false
      register: conteo

    - name: Mostrar la misión
      ansible.builtin.debug:
        msg:
          - "==============================================================="
          - "  Puesto de guardia listo en:  datos/reto/   (abrí MISION.txt)"
          - "  {{ conteo.stdout_lines | join('  |  ') }}"
          - "---------------------------------------------------------------"
          - "  Tu jefa te pide 3 respuestas. Sacalas del volcado y de la"
          - "  configuración, y armá la bandera con este formato EXACTO:"
          - "      BANDERA{<usuario>-<ip>-<Directiva>}"
          - ""
          - "  R1) ¿Contra QUÉ USUARIO se hicieron más intentos fallidos?"
          - "  R2) ¿Desde QUÉ IP salieron más intentos fallidos?"
          - "  R3) De las directivas que QUEDARON ACTIVAS, ¿cuál permite"
          - "      entrar sin contraseña? (tal cual se escribe, con mayúsculas)"
          - ""
          - "  Verificá tu bandera con Ansible (el repo NO la guarda en texto"
          - "  plano, solo su huella SHA-256):"
          - "     ansible-playbook comprobar_bandera.yml -e \"bandera=BANDERA{...}\""
          - "==============================================================="
